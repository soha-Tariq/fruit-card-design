<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="style.css">

    <title>Fruit Card Design</title>
</head>

<body>

    <main class="main-container">

        <!-- Image Card -->
        <section class="image-card">

            <!-- Top Icons -->
            <div class="card-header">

                <button class="icon-button" type="button">
                    ↗
                </button>

                <button class="icon-button" type="button">
                    ♡
                </button>

            </div>


            <!-- Main Apple Image -->
            <div class="main-img-container">

                <img
                    src="green_apple-removebg-preview.png"
                    class="main-apple"
                    alt="Green Apple"
                >

            </div>


            <!-- Apple Thumbnails -->
            <div class="thumbnail-container">

                <div class="thumb">
                    <img
                        src="full.webp"
                        alt="Full Apple"
                    >
                </div>

                <div class="thumb">
                    <img
                        src="Half_apple.png"
                        alt="Half Apple"
                    >
                </div>

                <div class="thumb">
                    <img
                        src="full.webp"
                        alt="Green Apple"
                    >
                </div>

                <div class="thumb">
                    <img
                        src="green_apple-removebg-preview.png"
                        alt="Apple"
                    >
                </div>

            </div>

        </section>


        <!-- Product Details -->
        <section class="product-details">

            <h1 class="product-title">
                Delicious Apples
            </h1>

            <p class="product-code">
                COC: 45999
            </p>


            <!-- Price -->
            <div class="product-price">
                <span>R$</span> 7.93
            </div>


            <!-- Select Color -->
            <div class="section-label">
                SELECT A COLOR
            </div>

            <div class="color-img">

                <div class="color-option selected">
                    <img
                        src="icons8-green-apple-30.png"
                        alt="Green Apple"
                    >
                </div>

                <div class="color-option selected">
                    <img
                        src="yellow_apple-removebg-preview.png"
                        alt="Yellow Apple"
                    >
                </div>

                <div class="color-option selected">
                    <img
                        src="yellow_red_apple-removebg-preview.png"
                        alt="Yellow Red Apple"
                    >
                </div>

                <div class="color-option selected">
                    <img
                        src="icons8-red-apple-30.png"
                        alt="Red Apple"
                    >
                </div>

            </div>


            <!-- Benefits -->
            <div class="section-label">
                BENEFITS
            </div>

            <ul class="benefits-list">

                <li>
                    Apples are nutritious
                </li>

                <li>
                    Apples may be good for weight loss
                </li>

                <li>
                    Apples may be good for bone health
                </li>

                <li>
                    They're linked to a lower risk of diabetes
                </li>

            </ul>


            <!-- Add To Cart -->
            <button class="add-to-cart-btn" type="button">
                ADD TO CART
            </button>

        </section>

    </main>

</body>
</html>
